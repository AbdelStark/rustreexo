[workspace]
resolver = "2"
members = [
    "rustreexo-core",
    "rustreexo-wasm",
]

# Maintain backward compatibility by re-exporting the core crate
[package]
name = "rustreexo"
version = "0.4.0"
authors = ["Calvin Kim <calvin@kcalvinalvin.info>"]
edition = "2021"
description = "A Rust implementation of Utreexo"
license = "MIT"
repository = "https://github.com/mit-dci/rustreexo"
readme = "README.md"
homepage = "https://github.com/mit-dci/rustreexo"
rust-version = "1.63.0"

[dependencies]
rustreexo-core = { path = "rustreexo-core" }

[features]
default = ["rustreexo-core/default"]
with-serde = ["rustreexo-core/with-serde"]

# Examples are available in the rustreexo-core crate