name: Performance Benchmarks

on:
  push:
    branches: [main, develop, performance/*]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run benchmarks daily at 2 AM UTC for performance monitoring
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      benchmark_suite:
        description: "Benchmark suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - stump
          - proof
          - accumulator
          - simple
      baseline:
        description: 'Compare against baseline (branch name or "none")'
        required: false
        default: "none"
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for baseline comparison

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-benchmark-${{ matrix.rust }}
          cache-on-failure: true

      - name: System information
        run: |
          echo "System Information:"
          echo "OS: ${{ matrix.os }}"
          echo "Target: ${{ matrix.target }}"
          echo "Rust version: ${{ matrix.rust }}"
          echo "CPU cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          echo "Memory: $(free -h 2>/dev/null || echo 'N/A on macOS')"
          echo "Disk space: $(df -h . | tail -1)"

      - name: Optimize environment for benchmarking (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Optimizing Linux environment for benchmarking..."
          # Disable swap to reduce variance
          sudo swapoff -a || true
          # Set CPU governor to performance mode
          echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor || true
          # Disable turbo boost for consistent measurements
          echo 1 | sudo tee /sys/devices/system/cpu/intel_pstate/no_turbo || true
          # Set process scheduler
          echo "Set high priority scheduling..."

      - name: Optimize environment for benchmarking (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Optimizing macOS environment for benchmarking..."
          # Reduce background processes impact
          sudo launchctl unload /System/Library/LaunchDaemons/com.apple.mds.messages.scan.plist || true

      - name: Validate benchmark compilation
        run: |
          echo "Checking benchmark compilation..."
          cargo check --benches --verbose
          echo "Benchmarks compile successfully ✅"

      - name: Run simple compatibility benchmark
        run: |
          echo "Running simple compatibility benchmark..."
          timeout 300s cargo bench --bench simple_benchmark || echo "Simple benchmark completed with timeout"

      - name: Run Stump benchmarks
        if: ${{ github.event.inputs.benchmark_suite == 'all' || github.event.inputs.benchmark_suite == 'stump' || github.event.inputs.benchmark_suite == '' }}
        run: |
          echo "Running Stump accumulator benchmarks..."
          mkdir -p benchmark-results
          timeout 900s cargo bench --bench stump_benchmarks -- --output-format json | tee benchmark-results/stump_results.json || echo "Stump benchmarks completed"

      - name: Run Proof benchmarks
        if: ${{ github.event.inputs.benchmark_suite == 'all' || github.event.inputs.benchmark_suite == 'proof' || github.event.inputs.benchmark_suite == '' }}
        run: |
          echo "Running Proof operation benchmarks..."
          mkdir -p benchmark-results
          timeout 900s cargo bench --bench proof_benchmarks -- --output-format json | tee benchmark-results/proof_results.json || echo "Proof benchmarks completed"

      - name: Run Accumulator comparison benchmarks
        if: ${{ github.event.inputs.benchmark_suite == 'all' || github.event.inputs.benchmark_suite == 'accumulator' || github.event.inputs.benchmark_suite == '' }}
        run: |
          echo "Running Accumulator comparison benchmarks..."
          mkdir -p benchmark-results
          timeout 900s cargo bench --bench accumulator_benchmarks -- --output-format json | tee benchmark-results/accumulator_results.json || echo "Accumulator benchmarks completed"

      - name: Run all benchmarks with HTML report generation
        if: ${{ github.event.inputs.benchmark_suite == 'all' || github.event.inputs.benchmark_suite == '' }}
        run: |
          echo "Generating comprehensive HTML reports..."
          timeout 1800s cargo bench -- --output-format html || echo "Full benchmark suite completed"

      - name: Generate performance summary
        run: |
          echo "Generating performance summary..."
          mkdir -p benchmark-results

          # Create a summary file
          cat > benchmark-results/summary.md << 'EOF'
          # Benchmark Results Summary

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **OS:** ${{ matrix.os }}
          **Rust:** ${{ matrix.rust }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Environment
          - **CPU Cores:** $(nproc 2>/dev/null || sysctl -n hw.ncpu)
          - **Runner:** ${{ runner.name }}
          - **Architecture:** ${{ matrix.target }}

          ## Benchmark Execution
          - **Trigger:** ${{ github.event_name }}
          - **Suite:** ${{ github.event.inputs.benchmark_suite || 'all' }}
          - **Baseline:** ${{ github.event.inputs.baseline || 'none' }}

          ## Results
          Detailed results are available in the artifacts and HTML reports.

          Key performance metrics:
          - Stump operations: See stump_results.json
          - Proof operations: See proof_results.json  
          - Accumulator comparisons: See accumulator_results.json
          EOF

      - name: Collect benchmark artifacts
        run: |
          echo "Collecting benchmark artifacts..."
          mkdir -p artifacts

          # Copy JSON results
          cp -r benchmark-results/* artifacts/ 2>/dev/null || echo "No JSON results to copy"

          # Copy HTML reports
          cp -r target/criterion artifacts/html-reports 2>/dev/null || echo "No HTML reports to copy"

          # Copy logs
          find . -name "*.log" -exec cp {} artifacts/ \; 2>/dev/null || echo "No logs found"

          # Create archive info
          echo "Archive created: $(date)" > artifacts/archive-info.txt
          echo "Commit: ${{ github.sha }}" >> artifacts/archive-info.txt
          echo "Branch: ${{ github.ref_name }}" >> artifacts/archive-info.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 90
          compression-level: 6

      - name: Upload HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-html-reports-${{ matrix.os }}-${{ github.run_number }}
          path: target/criterion/
          retention-days: 30
          compression-level: 9

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = `## 🚀 Benchmark Results\n\n`;
            comment += `**OS:** ${{ matrix.os }}\n`;
            comment += `**Commit:** \`${{ github.sha }}\`\n\n`;

            // Check if results exist
            if (fs.existsSync('benchmark-results/summary.md')) {
              const summary = fs.readFileSync('benchmark-results/summary.md', 'utf8');
              comment += summary;
            } else {
              comment += `Benchmark execution completed. Download artifacts for detailed results.\n`;
            }

            comment += `\n### 📊 Available Artifacts\n`;
            comment += `- Benchmark Results JSON\n`;
            comment += `- HTML Performance Reports\n`;
            comment += `- Execution Logs\n\n`;
            comment += `**Note:** Results are available in the Actions artifacts for 90 days.\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()
    needs: [benchmark]

    steps:
      - name: Reset environment
        run: |
          echo "Cleanup completed - environment reset for next run"
          echo "Benchmark workflow execution finished"
