# Rustreexo Benchmark Configuration
# This file defines settings for automated benchmarking and performance monitoring

# Global benchmark settings
global:
  timeout_seconds: 1800  # 30 minutes max per benchmark suite
  regression_threshold: 5.0  # 5% performance degradation threshold
  measurement_time: 10  # seconds per benchmark
  warmup_time: 3  # seconds for warmup
  sample_size: 100  # number of samples per benchmark

# Benchmark suites configuration
suites:
  stump:
    name: "Stump Accumulator Benchmarks"
    file: "stump_benchmarks"
    timeout: 900  # 15 minutes
    critical: true  # Must pass for PR approval
    parameters:
      element_counts: [10, 100, 1000, 10000]
      operations: ["add", "mixed", "verify", "serialize"]
    thresholds:
      latency_ms: 100  # Max 100ms for 1000 elements
      throughput_melem_s: 1.0  # Min 1M elements/second
      memory_mb: 50  # Max 50MB for 10k elements

  proof:
    name: "Proof Operation Benchmarks"  
    file: "proof_benchmarks"
    timeout: 900  # 15 minutes
    critical: true  # Must pass for PR approval
    parameters:
      target_counts: [1, 10, 50, 100]
      operations: ["create", "verify", "serialize", "update"]
    thresholds:
      verification_us: 10000  # Max 10ms verification
      creation_us: 50000  # Max 50ms creation
      proof_size_kb: 100  # Max 100KB proof size

  accumulator:
    name: "Accumulator Comparison Benchmarks"
    file: "accumulator_benchmarks"  
    timeout: 1200  # 20 minutes
    critical: false  # Informational, doesn't block PRs
    parameters:
      implementations: ["memforest", "stump", "pollard"]
      sizes: [100, 1000, 5000]
    thresholds:
      relative_performance: 2.0  # Max 2x slower than best

  simple:
    name: "Simple Compatibility Benchmarks"
    file: "simple_benchmark"
    timeout: 300  # 5 minutes  
    critical: false  # Compatibility check only
    parameters:
      basic_operations: true
    thresholds:
      completion_time_s: 60  # Must complete in 60 seconds

# Environment optimization settings
environment:
  linux:
    cpu_governor: "performance"
    disable_turbo: true
    disable_swap: true
    process_priority: -10
    cpu_affinity: "0-3"  # Use first 4 cores
    
  macos:
    disable_spotlight: true
    process_priority: -10
    
  windows:
    power_plan: "high_performance"
    process_priority: "high"

# Artifact settings
artifacts:
  retention_days:
    pr_results: 30
    main_results: 90
    regression_analysis: 30
    html_reports: 30
  
  compression_level: 6
  
  include_files:
    - "*.json"
    - "*.html" 
    - "*.md"
    - "*.log"
    - "*.txt"

# Monitoring and alerting
monitoring:
  enabled: true
  
  regression_detection:
    enabled: true
    threshold_percent: 5.0
    consecutive_failures: 2  # Alert after 2 consecutive regressions
    
  performance_trends:
    enabled: true
    window_days: 30  # Analyze 30-day trends
    alert_deviation_percent: 10.0
    
  notifications:
    slack_webhook: ""  # Set in repository secrets
    email_recipients: []  # Add email addresses
    
# CI/CD integration settings  
ci:
  trigger_on:
    push_branches: ["main", "develop", "performance/*"]
    pull_requests: ["main", "develop"]
    schedule: "0 2 * * *"  # Daily at 2 AM UTC
    
  parallel_jobs:
    enabled: true
    max_jobs: 2  # Run on 2 OS simultaneously
    
  auto_merge:
    enabled: false  # Don't auto-merge based on benchmarks
    require_approval: true
    
# Baseline management
baselines:
  storage: "artifacts"  # Store in GitHub Actions artifacts
  
  retention:
    main_branch: 180  # Keep main branch baselines for 6 months
    release_tags: 365  # Keep release baselines for 1 year
    
  comparison:
    statistical_test: "t_test"
    confidence_level: 0.95
    minimum_samples: 10

# Performance targets (for documentation and monitoring)
targets:
  stump_operations:
    add_1000_elements: "< 500µs"
    verify_proof_50_targets: "< 20µs" 
    serialize_10k_elements: "< 5ms"
    memory_10k_elements: "< 10MB"
    
  proof_operations:
    create_100_targets: "< 100ms"
    verify_complex_proof: "< 50ms"
    serialize_large_proof: "< 10ms"
    update_proof: "< 200ms"
    
  accumulator_comparisons:
    memforest_vs_stump: "< 2x difference"
    proof_generation: "< 100ms for 50 targets"
    memory_efficiency: "Linear scaling"

# Development workflow integration
development:
  pre_commit_benchmarks:
    enabled: false  # Don't run full benchmarks on every commit
    quick_check: true  # Run simple compatibility check
    
  local_development:
    quick_benchmark_timeout: 60  # 1 minute for local quick checks
    full_benchmark_timeout: 1800  # 30 minutes for full local runs
    
  optimization_workflow:
    baseline_before_changes: true
    compare_after_changes: true
    require_improvement_or_explanation: true

# Reporting settings
reporting:
  formats: ["html", "json", "markdown"]
  
  include_sections:
    - executive_summary
    - performance_metrics
    - regression_analysis
    - trend_analysis
    - recommendations
    - raw_data
    
  html_report:
    theme: "criterion_default"
    include_graphs: true
    interactive_charts: true
    
  json_export:
    include_raw_measurements: true
    statistical_analysis: true
    metadata: true